[pytest]
# Python tests of the repository (scripts, shell helpers, node integration).
# C++ unit tests are run by `colcon test`; tests/run_tests.sh runs both.
testpaths =
    unit
    integration
markers =
    integration: needs ROS 2 Jazzy and the built workspace (skipped when missing)
    vicon_live: needs a real Vicon DataStream server, set VICON_LIVE_HOST=host[:port] (skipped otherwise)
# The launch_testing plugin of ROS 2 (on the path once ROS is sourced) imports every test module
# during collection, outside pytest's error handling: a module-level skip (importorskip) then
# skipped the whole folder. This repository has no launch tests, so the plugin is blocked, with
# launch_ros (launch_testing_ros), which implements one of its hooks.
addopts = -ra --strict-markers -p no:cacheprovider -p no:launch_testing -p no:launch_ros
