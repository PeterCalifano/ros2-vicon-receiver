# =============================================================================
# vicon_client.yaml - Parameters of the vicon_receiver node (vicon_client).
#
# This file is the single source of truth for the node configuration: the node
# declares its parameters without defaults, so every entry below is required.
#
# Used by:   scripts/launch.sh  (default config), scripts/probe.sh (hostname)
# Manually:  ros2 run vicon_receiver vicon_client --ros-args --params-file config/vicon_client.yaml
#
# Note on types: ROS 2 parameters are statically typed. Write floating-point
# values with a decimal point (0.0, not 0), otherwise the node rejects them.
# =============================================================================
vicon_client:
  ros__parameters:
    # Vicon Tracker PC running the DataStream server (TCP). Optional ":port",
    # the DataStream server listens on port 801 by default.
    # 10.250.223.40: the Vicon Tracker PC on the lab network.
    hostname: "10.250.223.40"

    # Number of frames buffered by the Vicon SDK client.
    buffer_size: 200

    # Topics are published as /<namespace>/<subject_name>/<segment_name>.
    namespace: "vicon"

    # TF frames: world_frame -> vicon_frame (static) -> <subject>_<segment> (dynamic).
    world_frame: "map"
    vicon_frame: "vicon"

    # Static transform from world_frame to vicon_frame.
    # Translation [x, y, z] in metres; rotation [roll, pitch, yaw].
    map_xyz: [0.0, 0.0, 0.0]
    map_rpy: [0.0, 0.0, 0.0]
    # true: map_rpy is in degrees; false: radians.
    map_rpy_in_degrees: false

    # --- Streaming ---
    # SDK stream mode: "ServerPush" (the server sends every frame; late rather than
    # lost if the node is slow: use it for recording), "ClientPull" (the node asks
    # for the latest frame; frames are skipped if it is slow) or "ClientPullPreFetch".
    stream_mode: "ServerPush"

    # Labeled markers of every subject in the ViconFrame message.
    enable_marker_data: true
    # IDs of the cameras that saw each marker (needs enable_marker_data: true).
    enable_marker_ray_data: true

    # --- Timestamps ---
    # Stamps are the estimated camera acquisition time: frame-number timeline at the
    # server frame rate, offset fitted to (receive time - server latency) as the
    # minimum over this many frames (1000 = 10 s at 100 Hz; follows clock drift).
    acquisition_stamp_window_frames: 1000

    # --- Console telemetry ---
    # Period of the status line (rate, dropped frames, latency, quality, occlusion,
    # cameras per marker) [s]; 0.0 disables it.
    status_period_s: 1.0

    # --- Publishing ---
    # Depth of the ViconFrame publisher queue [frames] (100 = 1 s at 100 Hz): a slow
    # subscriber, e.g. a recorder, gets every frame instead of only the latest.
    frame_queue_depth: 100

    # --- Connection ---
    # Seconds without any answer from the Vicon server (TCP keepalive probes, sent
    # every second while no data arrives) before the connection counts as lost; the
    # node then stops with exit status 2 (no reconnection). An idle server that is
    # still reachable answers the probes. Range 2..3600.
    connection_timeout_s: 5

    # --- Start of a connection ---
    # A Vicon server first sends 1-2 frames left over from its previous session,
    # back to back. Frames are published once this many consecutive frame numbers
    # have arrived at a plausible pace (>= 2; leftovers were seen consecutive).
    live_stream_confirmation_frames: 3

    # --- Local clock check ---
    # The local clock is compared with the Vicon frame clock (frame numbers / rate)
    # over measurements of clock_check_measurement_s, using the least delayed frame
    # of the first and last clock_check_block_s (arrival jitter ~10 ms is 0.1 % of
    # 10 s). A warning is logged if the rates differ by more than
    # clock_rate_warning_limit (0.01 = 1 %; healthy clocks differ by a few ppm).
    clock_check_measurement_s: 10.0
    clock_check_block_s: 1.0
    clock_rate_warning_limit: 0.01
